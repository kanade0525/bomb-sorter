name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチの古い実行は打ち切る。CI は何度でも回して安全なのでキャンセルしてよい
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 検査（書式・型・単体テスト・ビルド）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 書式 → 型 → 単体テスト → 自作検査。手元の `npm run check` と同じもの
      - name: check
        run: npm run check

      - name: ビルド
        run: npx vite build

      # base の設定漏れをここで落とす。公開してから気づくと原因の切り分けが面倒になる
      - name: 成果物のパスを検証
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/.nojekyll
          grep -q '/bomb-sorter/assets/' dist/index.html \
            || { echo "::error::base が dist/index.html に反映されていない"; exit 1; }
          if grep -qE '(src|href)="/(assets|icons|favicon)' dist/index.html; then
            echo "::error::base の付いていない絶対パスが残っている"; exit 1
          fi
          node -e "
            const m = require('./dist/manifest.webmanifest');
            if (m.start_url !== '/bomb-sorter/') throw new Error('start_url が違う: ' + m.start_url);
            if (m.scope !== '/bomb-sorter/') throw new Error('scope が違う: ' + m.scope);
            for (const i of m.icons) if (i.src.startsWith('/')) throw new Error('アイコンは相対パスで書く: ' + i.src);
            console.log('manifest OK');
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    name: E2E（iPhone / Android / デスクトップ）
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # ブラウザは 400MB 近いのでキャッシュする。
      # キーに Playwright のバージョンを含めて、上げたら自然に入れ替わるようにする
      - name: Playwright のバージョンを取る
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: ブラウザのキャッシュ
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: ブラウザを入れる
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # キャッシュはバイナリだけ。OS 側の共有ライブラリは入っていないので入れ直す。
      # ここを忘れると WebKit が「shared library not found」で必ず落ちる
      - name: OS 側の依存だけ入れる
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: E2E
        run: npm run e2e

      - name: 目視用スクリーンショット
        if: ${{ !cancelled() }}
        run: npm run shots

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: shots
          retention-days: 14
