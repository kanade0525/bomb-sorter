<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover で safe-area-inset-* を使えるようにする -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0f14" />
    <!-- リンクを貼ったときに読まれる説明。共有される先は日本語圏に限らないので英語にする。
         画面の中の言葉は端末の言語に合わせて切り替わる（src/ui/strings.ts） -->
    <meta
      name="description"
      content="Drag the walking bombs into the bin that matches their colour before the fuses burn out. A one-thumb panic game that loads in under 200 ms."
    />

    <!-- CSP は本番ビルド時に vite.config.ts のプラグインが差し込む。
         ここに直接書くと dev サーバの HMR（インラインスタイルと WebSocket）が
         止まってしまうため、開発中は入れない。 -->

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BombSorter" />
    <!-- apple-touch-icon は manifest から読まれないので HTML に必ず書く -->
    <!-- base を直書きしないこと。Vite が base を前置してくれるので、
         ルート相対で書いておけば、相対パスで吐くビルド（YouTube ゲームルーム向け）でも
         そのまま正しくなる。直書きすると絶対パスのまま残り、認定要件に違反する -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Bomb Sorter</title>

    <!-- リンクのプレビュー。og:image と og:url は絶対 URL でないと読まれないので、
         公開先のドメインを直接書く。ゲームルーム向けビルドでは差し込まない
         （配信元が違い、絶対 URL は要件違反にもなる）-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bomb Sorter" />
    <meta property="og:title" content="Bomb Sorter" />
    <meta
      property="og:description"
      content="Sort the walking bombs by colour before the fuses burn out. Plays in the browser, in portrait or landscape."
    />
    <meta property="og:url" content="https://kanade0525.github.io/bomb-sorter/" />
    <meta property="og:image" content="https://kanade0525.github.io/bomb-sorter/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bomb Sorter — a red bomb and a black bomb standing on a factory floor"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <h1 class="sr-only">Bomb Sorter — ボムすけを色で仕分けるゲーム</h1>

    <div id="stage">
      <canvas id="game" role="application" aria-label="ボムすけ仕分けゲームの画面"></canvas>

      <!-- ボタンは Canvas に描かず実 button にする。
           キーボード操作・フォーカスリング・読み上げが無料で付いてくる。 -->
      <div id="hud-buttons">
        <!-- 中身のアイコン（Material Symbols のインライン SVG）は icons.ts が差し込む -->
        <button id="btn-fullscreen" type="button" aria-label="全画面にする" hidden></button>
        <button id="btn-mute" type="button" aria-label="音を消す" aria-pressed="false"></button>
        <button id="btn-pause" type="button" aria-label="一時停止"></button>
      </div>

      <div id="overlay" class="overlay">
        <!-- 画面ごとの内容は overlay.ts が差し替える -->
      </div>

      <div id="toast" class="toast" hidden>
        <span id="toast-text">新しいバージョンがあります</span>
        <button id="toast-action" type="button">更新する</button>
      </div>
    </div>

    <div id="sr-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="sr-alert" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
